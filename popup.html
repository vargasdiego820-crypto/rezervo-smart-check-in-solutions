<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EasyLink - Condfy</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="container">
    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <!-- SVG Logo: House with calendar and folded edge -->
        <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 10L12 3L21 10V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V10Z" stroke="#00A3FF" stroke-width="2" stroke-linejoin="round"/>
          <path d="M8 10H16V16H8V10Z" stroke="#fff" stroke-width="1.5"/>
          <path d="M10 8V12M14 8V12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M21 16L16 21" stroke="#00A3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-text">reser<span class="highlight">z</span>o</span>
      </div>
      <div class="status-indicator">
        <span class="pulse"></span>
        <span class="status-text" id="connection-status">Pronto</span>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="content">
      <div id="loader" class="loader-container hidden">
        <div class="spinner"></div>
        <p>Buscando hóspedes no NCollect...</p>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p>Nenhum hóspede na fila no momento.</p>
      </div>

      <div id="guest-list" class="guest-list">
        <!-- Guest cards will be injected here via popup.js -->
      </div>
    </main>
    
    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast hidden">
      <span id="toast-msg">Mensagem de feedback</span>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
